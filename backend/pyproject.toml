[project]
name = "astraquant-backend"
version = "0.1.0"
description = "AstraQuant X-2026 backend: modular monolith with six trading engines"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",          # REST + WebSocket API
  "uvicorn[standard]>=0.30", # ASGI server
  "pydantic-settings>=2.4",  # typed config from env / .env
  "sqlalchemy>=2.0",         # ORM
  "alembic>=1.13",           # migrations
  "psycopg[binary]>=3.2",    # PostgreSQL driver
  "redis>=5.0",              # live state / pub-sub
  "structlog>=24.1",         # structured JSON logs
  "httpx>=0.27",             # HTTP client (Upstox REST)
  "pandas>=2.2",             # candle frames, validation, resampling
  "pyarrow>=17",             # Parquet lake
  "openpyxl>=3.1",           # Signal Lab .xlsx uploads
  "xlrd>=2.0",               # Signal Lab legacy .xls uploads
  "cryptography>=43",        # Fernet encryption of broker tokens at rest
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: needs running Postgres and Redis", "slow: loads large models (FinBERT)"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
# Markdown table literals and verbatim RSS fixtures are clearer unwrapped.
"app/engines/ml/report.py" = ["E501"]
"app/engines/strategy/report.py" = ["E501"]
"tests/test_news.py" = ["E501"]
# NEVER let the import sorter reorder these: the order prevents an OpenMP segfault (see the module docstring).
"app/engines/ml/__init__.py" = ["I001"]
